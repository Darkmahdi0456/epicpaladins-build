name: Build Fabric Mod
on: [workflow_dispatch, push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          
      - name: Extract and Build Project
        run: |
          echo "=== لیست فایل‌ها در پوشه اصلی ==="
          ls -la
          
          ZIP_FILE="EpicPaladins-Fabric-1.21.4-final-stage77.zip"
          
          if [ ! -f "$ZIP_FILE" ]; then
            echo "❌ خطا: فایل زیپ پیدا نشد!"
            exit 1
          fi
          
          echo "در حال استخراج فایل زیپ..."
          unzip -o "$ZIP_FILE" -d extracted_project
          
          # ورود خودکار به پوشه stage57work داخل فایل زیپ
          if [ -d "extracted_project/stage57work" ]; then
            cd extracted_project/stage57work
          else
            GRADLEW_PATH=$(find extracted_project -name "gradlew" -type f | head -n 1)
            PROJECT_DIR=$(dirname "$GRADLEW_PATH")
            cd "$PROJECT_DIR"
          fi
          
          echo "پوشه کاری فعلی: $(pwd)"
          
          if [ ! -f "gradlew" ]; then
            echo "❌ خطا: فایل gradlew پیدا نشد!"
            exit 1
          fi
          
          chmod +x gradlew
          ./gradlew build --stacktrace
          
      - name: Upload Jar Artifact
        uses: actions/upload-artifact@v4
        with:
          name: EpicPaladins-Mod-Output
          path: "**/build/libs/*.jar"
          
