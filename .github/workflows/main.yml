name: Build Fabric Mod
on: [workflow_dispatch, push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Check Zip Contents
        run: |
          unzip -o EpicPaladins-Fabric-*.zip
          echo "=== List of all files extracted ==="
          find . -maxdepth 3 -not -path '*/.*'
          
          # بررسی وجود gradlew
          if [ ! -f "stage57work/gradlew" ] && [ ! -f "gradlew" ]; then
            echo "❌ خطا: فایل gradlew داخل فایل زیپ وجود ندارد! این فایل زیپ سورس کامل ساخت مد نیست."
            exit 1
          fi
          
          GRADLEW_PATH=$(find . -name "gradlew" -type f | head -n 1)
          PROJECT_DIR=$(dirname "$GRADLEW_PATH")
          cd "$PROJECT_DIR"
          chmod +x gradlew
          ./gradlew build --stacktrace
      - name: Upload Jar
        uses: actions/upload-artifact@v4
        with:
          name: EpicPaladins-Mod
          path: "**/build/libs/*.jar"
