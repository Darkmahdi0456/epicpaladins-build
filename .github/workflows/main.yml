name: Build Fabric Mod
on: [workflow_dispatch, push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Build Mod
        run: |
          unzip -o EpicPaladins-Fabric-*.zip
          TARGET_DIR=$(find . -maxdepth 2 -type d -name "*work*" | head -n 1)
          if [ -z "$TARGET_DIR" ]; then TARGET_DIR="."; fi
          echo "Entering directory: $TARGET_DIR"
          cd "$TARGET_DIR"
          chmod +x gradlew
          ./gradlew build
      - name: Upload Jar
        uses: actions/upload-artifact@v4
        with:
          name: EpicPaladins-Mod
          path: "**/build/libs/*.jar"
          
