name: Build Fabric Mod
on: [workflow_dispatch, push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Build Mod
        run: |
          unzip -o EpicPaladins-Fabric-*.zip
          cd stage57work || cd *work* || true
          chmod +x gradlew
          ./gradlew build
      - name: Upload Jar
        uses: actions/upload-artifact@v4
        with:
          name: EpicPaladins-Mod
          path: "**/build/libs/*.jar"
