name: Build Fabric Mod
on: [workflow_dispatch, push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          
      - name: Extract and Build
        run: |
          echo "=== ۱. بررسی فایل‌های پوشه روت ==="
          ls -la
          
          echo "=== ۲. باز کردن فایل زیپ ==="
          unzip -o EpicPaladins-Fabric-1.21.4-final-stage77.zip -d extracted_folder
          
          echo "=== ۳. لیست محتویات استخراج شده ==="
          ls -la extracted_folder
          ls -la extracted_folder/stage57work
          
          echo "=== ۴. رفتن به پوشه پروژه و بیلد ==="
          cd extracted_folder/stage57work
          
          chmod +x gradlew
          ./gradlew build --stacktrace

      - name: Upload Jar
        uses: actions/upload-artifact@v4
        with:
          name: EpicPaladins-Mod-Output
          path: "**/build/libs/*.jar"
          
