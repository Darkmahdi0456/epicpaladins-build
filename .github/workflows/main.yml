name: Build Fabric Mod
on: [workflow_dispatch, push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Check Zip Contents
        run: |
          echo "=== لیست تمام فایل‌های موجود در مخزن ==="
          ls -la
          
          # پیدا کردن فایل زیپ با هر نامی که با EpicPaladins شروع شود
          ZIP_FILE=$(find . -maxdepth 1 -name "*EpicPaladins*.zip" | head -n 1)
          
          if [ -z "$ZIP_FILE" ]; then
            echo "❌ خطا: هیچ فایل زیپی با نام EpicPaladins پیدا نشد!"
            exit 1
          fi
          
          echo "موفق شدم فایل زیپ را پیدا کنم: $ZIP_FILE"
          unzip -o "$ZIP_FILE" -d extracted_project
          
          echo "=== لیست فایل‌های استخراج شده ==="
          find extracted_project -maxdepth 3
          
          GRADLEW_PATH=$(find extracted_project -name "gradlew" -type f | head -n 1)
          if [ -z "$GRADLEW_PATH" ]; then
            echo "❌ خطا: فایل gradlew داخل فایل زیپ پیدا نشد!"
            exit 1
          fi
          
          PROJECT_DIR=$(dirname "$GRADLEW_PATH")
          cd "$PROJECT_DIR"
          chmod +x gradlew
          ./gradlew build --stacktrace
      - name: Upload Jar
        uses: actions/upload-artifact@v4
        with:
          name: EpicPaladins-Mod
          path: "**/build/libs/*.jar"
