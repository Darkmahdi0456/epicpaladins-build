 name: Check Zip Contents
   run: |
        echo "=== Checking available files ==="
        ls -la
        
        # پیدا کردن فایل زیپ پروژه به صورت خودکار
        ZIP_FILE=$(find . -maxdepth 1 -name "EpicPaladins-Fabric-*.zip" | head -n 1)
        
        if [ -z "$ZIP_FILE" ]; then
          echo "❌ خطا: فایل زیپ پیدا نشد! نام فایل را بررسی کنید."
          exit 1
        fi
        
        echo "Found zip: $ZIP_FILE"
        unzip -o "$ZIP_FILE" -d extracted_project
        
        echo "=== List of extracted files ==="
        find extracted_project -maxdepth 3
        
        # پیدا کردن مسیر درست gradw
        GRADLEW_PATH=$(find extracted_project -name "gradw" -o -name "gradlew" | head -n 1)
        if [ -z "$GRADLEW_PATH" ]; then
          echo "❌ خطا: فایل gradlew داخل فایل زیپ پیدا نشد!"
          exit 1
        fi
        
        PROJECT_DIR=$(dirname "$GRADLEW_PATH")
        cd "$PROJECT_DIR"
        chmod +x gradlew
        ./gradlew build --stacktrace
