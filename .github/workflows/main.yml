name: Build Fabric Mod
on: [workflow_dispatch, push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Build Mod
        run: |
          unzip -o EpicPaladins-Fabric-*.zip
          # پیدا کردن پوشه‌ای که gradlew در آن وجود دارد
          PROJECT_DIR=$(find . -name "gradlew" -exec dirname {} \;)
          echo "Found gradlew in: $PROJECT_DIR"
          cd "$PROJECT_DIR"
          chmod +x gradlew
          ./gradlew build --stacktrace
      - name: Upload Jar
        uses: actions/upload-artifact@v4
        with:
          name: EpicPaladins-Mod
          path: "**/build/libs/*.jar"
          
