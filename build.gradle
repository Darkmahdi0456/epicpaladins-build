plugins { id 'fabric-loom' version '1.8-SNAPSHOT' }
version = '1.4.3-fabric-port-dev'
group = 'net.veroxuniverse'
base { archivesName = 'epicpaladins-fabric-1.21.4-dev' }
repositories { maven { url = 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/' } }
dependencies {
 minecraft 'com.mojang:minecraft:1.21.4'
 mappings 'net.fabricmc:yarn:1.21.4+build.8:v2'
 modImplementation 'net.fabricmc:fabric-loader:0.16.10'
 modImplementation 'net.fabricmc.fabric-api:fabric-api:0.119.3+1.21.4'
 modImplementation 'software.bernie.geckolib:geckolib-fabric-1.21.4:4.8'
}
processResources { inputs.property 'version', project.version; filesMatching('fabric.mod.json') { expand 'version': project.version } }
java { toolchain { languageVersion = JavaLanguageVersion.of(21) }; withSourcesJar() }
